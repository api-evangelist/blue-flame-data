description: >-
  Blue Flame Data was an early-2000s consumer-preference analytics company (founded around
  2000 in New York City) that built web-based software for real-time measurement of consumer market
  preferences, marketed as TrueChoice Preference Technology for quantifying the preference structures of
  individual consumers and employees. The company appears to be defunct: its domain (blueflamedata.com)
  resolves to a parked/unresponsive IP and does not serve a live site. It was surfaced to the API
  Evangelist network via Battery Ventures portfolio mining. During enrichment no public API, developer
  portal, documentation, SDKs, packages, MCP server, or other machine-readable artifacts could be
  located, so no API artifacts were produced.
